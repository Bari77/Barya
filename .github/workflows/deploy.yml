name: Déploiement

on:
  push:
    branches: [master, main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  back:
    name: Image du serveur
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ vars.REGISTRY_IMAGE || 'registry.bariserv.net/barya' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: registry.bariserv.net
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: back
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  front:
    name: GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Dépendances
        working-directory: front
        run: npm ci

      - name: Adresse de l'API
        working-directory: front
        env:
          API_BASE: ${{ vars.API_BASE }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const base = (process.env.API_BASE || '').replace(/\/$/, '');
          fs.writeFileSync('public/config.json', JSON.stringify({ apiBase: base }) + '\n');
          NODE

      - name: Build
        working-directory: front
        run: npx ng build --base-href /Barya/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: front/dist/front/browser

      - id: deployment
        uses: actions/deploy-pages@v4
